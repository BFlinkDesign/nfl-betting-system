name: Temporary World Cup hardening formatter

on:
  push:
    branches:
      - codex/intel-alignment-hardening-20260716

concurrency:
  group: temporary-world-cup-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/intel-alignment-hardening-20260716
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Format bounded change set
        run: |
          files=(
            src/betting/decision_receipt.py
            scripts/evaluate_market_decision.py
            tests/test_decision_receipt.py
          )
          isort --profile black "${files[@]}"
          black "${files[@]}"
          black --check "${files[@]}"
          isort --check-only --profile black "${files[@]}"
          ruff check "${files[@]}"

      - name: Run focused tests and compilation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_decision_receipt.py
          python -m compileall -q src scripts

      - name: Commit deterministic formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/betting/decision_receipt.py \
            scripts/evaluate_market_decision.py \
            tests/test_decision_receipt.py
          if git diff --cached --quiet; then
            echo "No formatter changes required."
          else
            git commit -m "style: format World Cup decision hardening"
            git push origin HEAD:codex/intel-alignment-hardening-20260716
          fi
