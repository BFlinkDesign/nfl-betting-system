name: Temporary hardening formatter

on:
  push:
    branches:
      - codex/intel-alignment-hardening-20260716

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: codex/intel-alignment-hardening-20260716
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned development tools and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply explicit compatibility and import-boundary hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(
                      f"Expected source block was not found in {path}; refusing to guess"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          bulldog_path = Path("scripts/bulldog_edge_discovery.py")
          bulldog_old = '''PROJECT_ROOT = Path(__file__).resolve().parent.parent
          sys.path.insert(0, str(PROJECT_ROOT))

          import pandas as pd
          from scipy import stats

          from src.discovery_validation import benjamini_hochberg, wilson_lower_bound
          from src.strategy_registry import StrategyRegistry
          '''
          bulldog_new = '''import pandas as pd
          from scipy import stats

          PROJECT_ROOT = Path(__file__).resolve().parent.parent
          sys.path.insert(0, str(PROJECT_ROOT))

          from src.discovery_validation import benjamini_hochberg, wilson_lower_bound  # noqa: E402
          from src.strategy_registry import StrategyRegistry  # noqa: E402
          '''
          current_bulldog = bulldog_path.read_text(encoding="utf-8")
          if "# noqa: E402" not in current_bulldog:
              replace_once(bulldog_path, bulldog_old, bulldog_new)

          registry_path = Path("src/strategy_registry.py")
          registry_old = '''            base_id = re.sub(r"_v\\d+$", "", original.strategy_id)
          new_id = f"{base_id}_v{new_version}"
          if new_id in self.strategies:
              return False, f"Strategy ID {new_id} already exists"

          new_strategy = Strategy(
              strategy_id=new_id,
              name=f"{re.sub(r' \\(v\\d+\\)$', '', original.name)} (v{new_version})",
          '''
          registry_new = '''            base_id = re.sub(r"_v\\d+$", "", original.strategy_id)
          new_id = f"{base_id}_v{new_version}"
          if new_id in self.strategies:
              return False, f"Strategy ID {new_id} already exists"

          base_name = re.sub(r" \\(v\\d+\\)$", "", original.name)
          new_strategy = Strategy(
              strategy_id=new_id,
              name=f"{base_name} (v{new_version})",
          '''
          replace_once(registry_path, registry_old, registry_new)

      - name: Apply pinned formatters to the bounded change set
        run: |
          files=(
            src/strategy_registry.py
            src/discovery_validation.py
            scripts/bulldog_edge_discovery.py
            tests/test_strategy_registry.py
            tests/test_discovery_validation.py
            tests/test_bulldog_edge_discovery.py
          )
          isort --profile black "${files[@]}"
          black "${files[@]}"
          black --check "${files[@]}"
          isort --check-only --profile black "${files[@]}"
          ruff check "${files[@]}"

      - name: Run focused regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_strategy_registry.py \
            tests/test_discovery_validation.py \
            tests/test_bulldog_edge_discovery.py
          python -m compileall -q src scripts

      - name: Reproduce authoritative Python 3.11 suite and preserve evidence
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          pytest --cov=src --cov-report=xml --cov-report=html tests/ -m "not integration and not slow" 2>&1 | tee /tmp/hardening-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "python=3.11"
            echo "exit_code=${status}"
            echo "--- final 200 log lines ---"
            tail -n 200 /tmp/hardening-full-suite.log
          } > .ci-hardening-full-suite.txt

      - name: Commit deterministic compatibility, formatter, and diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/strategy_registry.py \
            src/discovery_validation.py \
            scripts/bulldog_edge_discovery.py \
            tests/test_strategy_registry.py \
            tests/test_discovery_validation.py \
            tests/test_bulldog_edge_discovery.py \
            .ci-hardening-full-suite.txt
          if git diff --cached --quiet; then
            echo "No compatibility, formatter, or diagnostic changes required."
          else
            git commit -m "fix: restore Python 3.10 and 3.11 compatibility"
            git push origin HEAD:codex/intel-alignment-hardening-20260716
          fi
