name: Temporary hardening formatter

on:
  push:
    branches:
      - codex/intel-alignment-hardening-20260716

concurrency:
  group: temporary-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: codex/intel-alignment-hardening-20260716
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned development tools and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply bounded compatibility and read-only hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(
                      f"Expected source block was not found in {path}; refusing to guess"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          registry_path = Path("src/strategy_registry.py")
          replace_once(
              registry_path,
              '''    def __init__(self, registry_path: str | Path | None = None):
          self.registry_path = (
              DEFAULT_REGISTRY_PATH if registry_path is None else Path(registry_path)
          )
          self.strategies: Dict[str, Strategy] = {}
          self._fingerprint: Optional[str] = None
          self._load_registry()
          ''',
              '''    def __init__(
              self, registry_path: str | Path | None = None, *, read_only: bool = False
          ):
              self.registry_path = (
                  DEFAULT_REGISTRY_PATH if registry_path is None else Path(registry_path)
              )
              self.read_only = read_only
              self.strategies: Dict[str, Strategy] = {}
              self._fingerprint: Optional[str] = None
              self._load_registry()
          ''',
          )
          replace_once(
              registry_path,
              '''        if not self.registry_path.exists():
              self.strategies = {}
              self._fingerprint = None
              self._persist({})
              return
          ''',
              '''        if not self.registry_path.exists():
              self.strategies = {}
              self._fingerprint = None
              if not self.read_only:
                  self._persist({})
              return
          ''',
          )
          replace_once(
              registry_path,
              '''    def _persist(self, strategies: Dict[str, Strategy]) -> None:
              self.registry_path.parent.mkdir(parents=True, exist_ok=True)
          ''',
              '''    def _persist(self, strategies: Dict[str, Strategy]) -> None:
              if self.read_only:
                  raise RegistryPersistenceError("registry is open in read-only mode")
              self.registry_path.parent.mkdir(parents=True, exist_ok=True)
          ''',
          )
          replace_once(
              registry_path,
              '''            base_id = re.sub(r"_v\\d+$", "", original.strategy_id)
          new_id = f"{base_id}_v{new_version}"
          if new_id in self.strategies:
              return False, f"Strategy ID {new_id} already exists"

          new_strategy = Strategy(
              strategy_id=new_id,
              name=f"{re.sub(r' \\(v\\d+\\)$', '', original.name)} (v{new_version})",
          ''',
              '''            base_id = re.sub(r"_v\\d+$", "", original.strategy_id)
          new_id = f"{base_id}_v{new_version}"
          if new_id in self.strategies:
              return False, f"Strategy ID {new_id} already exists"

          base_name = re.sub(r" \\(v\\d+\\)$", "", original.name)
          new_strategy = Strategy(
              strategy_id=new_id,
              name=f"{base_name} (v{new_version})",
          ''',
          )

          bulldog_path = Path("scripts/bulldog_edge_discovery.py")
          bulldog_text = bulldog_path.read_text(encoding="utf-8")
          if "# noqa: E402" not in bulldog_text:
              replace_once(
                  bulldog_path,
                  '''PROJECT_ROOT = Path(__file__).resolve().parent.parent
          sys.path.insert(0, str(PROJECT_ROOT))

          import pandas as pd
          from scipy import stats

          from src.discovery_validation import benjamini_hochberg, wilson_lower_bound
          from src.strategy_registry import StrategyRegistry
          ''',
                  '''import pandas as pd
          from scipy import stats

          PROJECT_ROOT = Path(__file__).resolve().parent.parent
          sys.path.insert(0, str(PROJECT_ROOT))

          from src.discovery_validation import benjamini_hochberg  # noqa: E402
          from src.discovery_validation import wilson_lower_bound  # noqa: E402
          from src.strategy_registry import StrategyRegistry  # noqa: E402
          ''',
              )
          replace_once(
              bulldog_path,
              '''        self._finalized = False
          self.registry = StrategyRegistry(registry_path)
          ''',
              '''        self._finalized = False
          self.registry = StrategyRegistry(registry_path, read_only=True)
          ''',
          )

          registry_test_path = Path("tests/test_strategy_registry.py")
          registry_test = registry_test_path.read_text(encoding="utf-8")
          if "test_read_only_registry_does_not_create_or_mutate_state" not in registry_test:
              registry_test += '''

          def test_read_only_registry_does_not_create_or_mutate_state(tmp_path):
              path = tmp_path / "registry.json"
              registry = StrategyRegistry(path, read_only=True)

              assert not path.exists()
              success, message = registry.add_strategy(make_strategy())
              assert not success
              assert "read-only mode" in message
              assert registry.strategies == {}
              assert not path.exists()
          '''
              registry_test_path.write_text(registry_test, encoding="utf-8")

          bulldog_test_path = Path("tests/test_bulldog_edge_discovery.py")
          replace_once(
              bulldog_test_path,
              '''    assert discovery.edges_found == []
          assert discovery.registry.get_stats()["total"] == 0
          ''',
              '''    assert discovery.edges_found == []
          assert discovery.registry.get_stats()["total"] == 0
          assert not (tmp_path / "registry.json").exists()
          ''',
          )

      - name: Apply pinned formatters to the bounded change set
        run: |
          files=(
            src/strategy_registry.py
            src/discovery_validation.py
            scripts/bulldog_edge_discovery.py
            tests/test_strategy_registry.py
            tests/test_discovery_validation.py
            tests/test_bulldog_edge_discovery.py
          )
          isort --profile black "${files[@]}"
          black "${files[@]}"
          black --check "${files[@]}"
          isort --check-only --profile black "${files[@]}"
          ruff check "${files[@]}"

      - name: Verify Python grammar compatibility
        shell: python
        run: |
          import ast
          from pathlib import Path

          for path in (
              Path("src/strategy_registry.py"),
              Path("scripts/bulldog_edge_discovery.py"),
          ):
              source = path.read_text(encoding="utf-8")
              for minor in (10, 11):
                  ast.parse(source, filename=str(path), feature_version=(3, minor))

      - name: Run focused regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_strategy_registry.py \
            tests/test_discovery_validation.py \
            tests/test_bulldog_edge_discovery.py
          python -m compileall -q src scripts

      - name: Reproduce authoritative Python 3.11 suite and preserve evidence
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          pytest --cov=src --cov-report=xml --cov-report=html tests/ -m "not integration and not slow" 2>&1 | tee /tmp/hardening-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "python=3.11"
            echo "exit_code=${status}"
            echo "--- final 200 log lines ---"
            tail -n 200 /tmp/hardening-full-suite.log
          } > .ci-hardening-full-suite.txt

      - name: Commit deterministic hardening and diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/strategy_registry.py \
            src/discovery_validation.py \
            scripts/bulldog_edge_discovery.py \
            tests/test_strategy_registry.py \
            tests/test_discovery_validation.py \
            tests/test_bulldog_edge_discovery.py \
            .ci-hardening-full-suite.txt
          if git diff --cached --quiet; then
            echo "No hardening or diagnostic changes required."
          else
            git commit -m "fix: enforce read-only research registry and compatibility"
            git push origin HEAD:codex/intel-alignment-hardening-20260716
          fi
